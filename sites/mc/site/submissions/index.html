<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>提交记录</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #fff; color: #172234; font: 16px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { width: min(1040px, calc(100% - 32px)); margin: 56px auto; }
      h1 { margin: 0 0 25px; font-size: clamp(1.5rem, 4vw, 2.1rem); }
      .table-wrap { overflow-x: auto; border: 1px solid #dce4eb; border-radius: 14px; }
      table { width: 100%; min-width: 660px; border-collapse: collapse; text-align: left; }
      th, td { padding: 15px 18px; border-bottom: 1px solid #e8edf1; vertical-align: top; }
      th { background: #f5f8f9; font-size: .88rem; }
      tr:last-child td { border-bottom: 0; }
      #status { margin: 0 0 15px; color: #5f6d7f; }
      #status.error { color: #b42318; }
      .empty { padding: 25px 18px; color: #5f6d7f; }
    </style>
  </head>
  <body>
    <main>
      <h1>提交记录</h1>
      <p id="status" role="status" aria-live="polite">正在加载…</p>
      <div class="table-wrap"><table><thead><tr><th>日期</th><th>班级</th><th>姓名</th><th>文件名</th></tr></thead><tbody id="rows"></tbody></table></div>
    </main>
    <script>
      const status = document.querySelector('#status');
      const rows = document.querySelector('#rows');
      const formatDate = (value) => {
        const date = new Date(value);
        return Number.isNaN(date.valueOf()) ? value : new Intl.DateTimeFormat('zh-CN', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Shanghai' }).format(date);
      };
      const cell = (value) => { const element = document.createElement('td'); element.textContent = value; return element; };
      fetch('https://share.gaojihe.cn/api/assignments/records')
        .then(async (response) => { const body = await response.json(); if (!response.ok) throw new Error(body.error || '暂时无法加载提交记录。'); return body; })
        .then(({ submissions }) => {
          status.remove();
          if (!submissions.length) { rows.innerHTML = '<tr><td class="empty" colspan="4">暂时没有提交记录。</td></tr>'; return; }
          submissions.forEach((submission) => { const row = document.createElement('tr'); row.append(cell(formatDate(submission.date)), cell(submission.className), cell(submission.studentName), cell(submission.filename)); rows.append(row); });
        })
        .catch((error) => { status.textContent = error instanceof Error ? error.message : '暂时无法加载提交记录。'; status.classList.add('error'); });
    </script>
  </body>
</html>
